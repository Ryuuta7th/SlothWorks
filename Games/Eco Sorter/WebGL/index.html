
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eco Sorter</title>

    <style>
        body {
            margin: 0;
            background: #111;
            overflow: hidden;
        }

        #unity-container {
            width: 100vw;
            height: 100vh;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #231F20;
        }
    </style>
</head>

<body>

    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <script src="Build/Eco Sorter.loader.js"></script>

    <script>
        const canvas = document.querySelector("#unity-canvas");

        createUnityInstance(canvas, {
            dataUrl: "Build/Eco Sorter.data.br",
            frameworkUrl: "Build/Eco Sorter.framework.js.br",
            codeUrl: "Build/Eco Sorter.wasm.br"
        });
    </script>

</body>
</html>
